<style>
/* =========================================================
   Sunflower Loy Krathong — styles
   ========================================================= */
:root{
  --sun:#FFD84D; --butter:#FFF4C2; --cream:#FFFDF5; --honey:#F2B93B;
  --leaf:#73965B; --brown:#71533B; --navy:#182B49; --water:#6EA9C8;
  --font:'Mali','Noto Sans Thai','Sarabun','Thonburi','Tahoma','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:var(--brown);
  font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit}
h1,p{margin:0}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- scene system ---------- */
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .8s ease, visibility 0s linear .8s}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .8s ease, visibility 0s}
.scene:not(.active):not(.leaving) *{animation-play-state:paused!important}
.s-yellow{background:radial-gradient(circle at 50% 36%,#FFF4C2 0,#FFE680 42%,#FFD84D 100%)}
.s-cream{background:radial-gradient(circle at 50% 40%,#fff 0,#FFFDF5 35%,#FFF4C2 100%)}

.center-col{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3dvh,26px);padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
.center-col.top{justify-content:flex-start;padding-top:max(10dvh,env(safe-area-inset-top))}

/* entrance animation helpers */
.enter{opacity:0}
.scene:is(.active,.leaving) .enter{animation:enterRise .85s cubic-bezier(.2,.85,.25,1) var(--dl,.2s) both}
.scene:is(.active,.leaving) .enter.pop{animation-name:enterPop}
@keyframes enterRise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes enterPop{from{opacity:0;transform:scale(.55)}60%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- card + buttons ---------- */
.card{width:min(92vw,420px);padding:26px 22px 24px;border-radius:32px;text-align:center;
  background:rgba(255,253,245,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 18px 40px rgba(113,83,59,.2),inset 0 0 0 2px rgba(255,255,255,.75)}
.card h1{font-size:clamp(1.55rem,6.6vw,2.15rem);font-weight:700;line-height:1.4;text-wrap:balance;overflow-wrap:anywhere}
.card .sub{margin-top:8px;font-size:clamp(1.2rem,5vw,1.5rem);font-weight:600;color:#9a6f2f;text-wrap:balance}
.btns{display:flex;flex-direction:column;gap:14px;margin-top:22px;align-items:center}
.card>.btn{margin-top:22px}

.btn{font-weight:700;font-size:1.15rem;border:0;border-radius:999px;padding:.8em 1.9em;min-height:54px;min-width:150px;
  cursor:pointer;color:var(--brown);touch-action:manipulation;user-select:none;-webkit-user-select:none;
  transition:transform .15s,box-shadow .2s,opacity .5s,filter .2s}
.btn.primary{background:linear-gradient(180deg,#FFE680,#FFD84D);box-shadow:0 6px 0 #E3A92A,0 14px 24px rgba(113,83,59,.25)}
.btn.secondary{background:var(--cream);border:2px solid var(--honey);box-shadow:0 5px 0 rgba(242,185,59,.6),0 12px 20px rgba(113,83,59,.12)}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(4px)}
.btn.primary:active{box-shadow:0 2px 0 #E3A92A,0 6px 12px rgba(113,83,59,.2)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{cursor:default}
.btn.bounce{animation:btnBounce 2.2s ease-in-out infinite}
@keyframes btnBounce{0%,100%{scale:1}50%{scale:1.06}}
.btn.big{font-size:1.3rem;padding:.85em 2.4em}
.btn.pulse{box-shadow:0 6px 0 #E3A92A,0 0 0 0 rgba(255,216,77,.7),0 14px 24px rgba(0,0,0,.35)}
.scene:is(.active,.leaving) .btn.pulse{animation:enterRise .85s cubic-bezier(.2,.85,.25,1) var(--dl,.2s) both,btnGlow 2.4s ease-in-out 1.6s infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 6px 0 #E3A92A,0 0 0 0 rgba(255,216,77,.55),0 14px 24px rgba(0,0,0,.35)}50%{box-shadow:0 6px 0 #E3A92A,0 0 0 14px rgba(255,216,77,0),0 14px 24px rgba(0,0,0,.35)}}
.btn.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- sunflower illustrations ---------- */
.sf{width:100%;height:100%;display:block;overflow:visible}
.sf .pt{transform-box:fill-box;transform-origin:50% 100%;opacity:0}
.sf .ctr{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.sf .face{opacity:0}
.sf .eye{transform-box:fill-box;transform-origin:50% 50%}
.scene:is(.active,.leaving) .sf .pt{animation:bloom .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*.035s + .15s)}
.scene:is(.active,.leaving) .sf .ctr{animation:bloom .6s cubic-bezier(.34,1.56,.64,1) .05s both}
.scene:is(.active,.leaving) .sf .face{animation:fadeIn .6s ease 1s both}
.scene:is(.active,.leaving) .sf .eye{animation:blink 4.6s ease-in-out 1.8s infinite}
.scene:is(.active,.leaving) .sf .stem{animation:fadeIn .8s ease .1s both}
.sf .stem{opacity:0}
@keyframes bloom{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.sf-hero{position:relative;isolation:isolate;width:min(62vw,33dvh,290px);aspect-ratio:1}
.sf-hero.big{width:min(70vw,36dvh,320px)}
.sf-hero::before{content:'';position:absolute;inset:-20%;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,244,194,0) 66%);animation:glowPulse 3s ease-in-out infinite alternate}
.sf-hero .sf{animation:sfSway 3.2s ease-in-out infinite alternate}
@keyframes sfSway{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.03)}}
@keyframes glowPulse{from{opacity:.6;transform:scale(.94)}to{opacity:1;transform:scale(1.06)}}
.sf-hero.jump{animation:jump .75s cubic-bezier(.3,1.4,.5,1)}
.sf-hero.spin{animation:spin .95s cubic-bezier(.3,1.3,.5,1)}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.12,.94)}70%{transform:translateY(0) scale(.94,1.08)}100%{transform:none}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.18)}100%{transform:rotate(360deg) scale(1)}}

/* ---------- loading ---------- */
.load-text{font-size:clamp(1.1rem,4.6vw,1.4rem);font-weight:700;text-align:center;color:var(--brown)}
.bar{width:min(62vw,260px);height:14px;border-radius:99px;background:rgba(255,255,255,.7);box-shadow:inset 0 2px 4px rgba(113,83,59,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#F2B93B,#FFD84D,#FFF4C2);
  box-shadow:0 0 12px rgba(255,216,77,.9);transition:width .2s linear}

/* ---------- petals / sparkles / fx ---------- */
.petals,.sparkles{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.petal{position:absolute;top:-8%;width:var(--s);height:calc(var(--s)*1.5);border-radius:60% 40% 60% 40%/80% 80% 20% 20%;
  background:linear-gradient(160deg,#FFEA8F,#F2B93B);box-shadow:inset 0 -2px 3px rgba(200,140,20,.25);opacity:.92;
  animation:fall var(--d) linear var(--delay) infinite;will-change:transform}
@keyframes fall{
  0%{transform:translate3d(0,0,0) rotate(0)}
  25%{transform:translate3d(var(--sw),28vh,0) rotate(calc(var(--rot)*.25))}
  50%{transform:translate3d(calc(var(--sw)*-1),56vh,0) rotate(calc(var(--rot)*.5))}
  75%{transform:translate3d(var(--sw),84vh,0) rotate(calc(var(--rot)*.75))}
  100%{transform:translate3d(0,114vh,0) rotate(var(--rot))}}
.sp{position:absolute;width:var(--s);height:var(--s);background:linear-gradient(135deg,#fff,#FFC933);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
  animation:twinkle var(--d) ease-in-out var(--dl) infinite;opacity:0}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

#fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.fx{position:absolute;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);animation:pop 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.fx.petal-fx{height:calc(var(--sz)*1.5);border-radius:60% 40% 60% 40%/80% 80% 20% 20%;background:linear-gradient(160deg,#FFEA8F,#F2B93B)}
.fx.spark{background:linear-gradient(135deg,#fff,#FFC933);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
.fx.heart-fx{width:auto;height:auto;font-size:var(--sz);line-height:1;margin:0;translate:-50% -50%}
.fx.heart-fx::before{content:'💛'}
@keyframes pop{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 60px)) scale(1) rotate(var(--r));opacity:0}}
.fx.rain{margin:0;animation:rain var(--rd) linear forwards}
@keyframes rain{0%{transform:translate(0,-30px) rotate(0);opacity:1}100%{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}

/* ---------- river backdrop (pages 2,3,4) ---------- */
.bg,.world{position:absolute;inset:0}
.bg{transform-origin:50% 58%}
.rv{position:absolute;inset:0;overflow:hidden}
.rv>*{position:absolute}
.rv-sky{left:0;right:0;top:0;height:calc(var(--h) + 1px)}
.rv.dusk .rv-sky{background:linear-gradient(to top,#FFD84D 0%,#FFC567 14%,#F6A06A 32%,#B07D9C 58%,#5A5F9A 80%,#2B3F6E 100%)}
.rv.night .rv-sky{background:linear-gradient(to top,#8a6a5a 0%,#4a4a72 10%,#26396a 38%,#182B49 72%,#0e1c36 100%)}
.rv-sun{left:50%;top:calc(var(--h) - 9%);width:90vmax;height:18%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 100%,rgba(255,244,194,.85),rgba(255,216,77,0) 60%)}
.star{border-radius:50%;background:#fff;width:var(--s);height:var(--s);animation:twinkleS var(--d) ease-in-out var(--dl) infinite}
@keyframes twinkleS{0%,100%{opacity:.25}50%{opacity:1}}
.rv-shore{left:0;right:0;top:calc(var(--h) - 7%);height:7.2%}
.rv-shore svg{width:100%;height:100%;display:block}
.rv.dusk .rv-shore path{fill:#3b3358}
.rv.night .rv-shore path{fill:#0c182c}
.shl{width:var(--ls);height:var(--ls);border-radius:50%;background:#FFE9A0;box-shadow:0 0 calc(var(--ls)*3) calc(var(--ls)*.8) rgba(255,214,102,.65);
  top:calc(var(--h) - .5%);animation:twinkleS var(--d) ease-in-out var(--dl) infinite}
.rv-water{left:0;right:0;top:var(--h);bottom:0}
.rv.dusk .rv-water{background:linear-gradient(to bottom,#f0c071 0%,#9fb0bb 7%,#6389ab 28%,#2d557c 68%,#1c3a5c 100%)}
.rv.night .rv-water{background:linear-gradient(to bottom,#46607c 0%,#2c4b70 9%,#1b3556 40%,#0e2038 100%)}
.rip{height:var(--rh);width:var(--rw);border-radius:50%;opacity:var(--ro);
  background:linear-gradient(90deg,transparent,rgba(210,230,255,.85),transparent);animation:shim var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes shim{from{transform:translateX(calc(var(--rx)*-1));opacity:calc(var(--ro)*.35)}to{transform:translateX(var(--rx));opacity:var(--ro)}}
.streak{width:var(--sw);height:var(--sh);top:calc(var(--h) + .4%);background:linear-gradient(to bottom,rgba(255,214,102,.8),rgba(255,214,102,0));
  filter:blur(1px);animation:streakS var(--d) ease-in-out var(--dl) infinite alternate;transform-origin:50% 0}
@keyframes streakS{from{transform:scaleY(.7) scaleX(.8);opacity:.45}to{transform:scaleY(1.1) scaleX(1.5);opacity:.95}}
.flt{width:var(--s);height:var(--s);border-radius:50%;background:#FFE9A0;box-shadow:0 0 calc(var(--s)*3) calc(var(--s)*.9) rgba(255,214,102,.6);animation:drift var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes drift{from{transform:translate(-14px,0)}to{transform:translate(18px,3px)}}
.fly{width:3px;height:3px;border-radius:50%;background:#FFF4C2;box-shadow:0 0 8px 2px rgba(255,230,140,.8);animation:flyA var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes flyA{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(var(--fx),var(--fy));opacity:.3}}

/* festival krathong (pages 2/3) */
.fest-kr{position:absolute;left:50%;bottom:8%;width:min(44vw,200px);margin-left:calc(min(44vw,200px)/-2);z-index:1;
  animation:festDrift 16s ease-in-out infinite alternate}
.fest-kr.slow{animation-duration:22s;--dx:11vw}
.fest-kr{--dx:18vw}
@keyframes festDrift{from{transform:translateX(calc(var(--dx)*-1)) rotate(-2deg)}to{transform:translateX(var(--dx)) rotate(2deg)}}
.fest-kr .kr-bob{animation:bobY 3.2s ease-in-out infinite}
.fest-kr .kr-refl{opacity:.75}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-4px) rotate(.6deg)}}

/* krathong parts (shared) */
.kr-svg{width:100%;height:100%;display:block;overflow:visible}
.kr-refl{position:absolute;left:30%;width:40%;top:97%;height:85%;background:linear-gradient(to bottom,rgba(255,214,102,.75),rgba(255,214,102,0));
  border-radius:50%;filter:blur(6px);animation:reflS 2.4s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes reflS{from{transform:scaleX(.8) scaleY(.85)}to{transform:scaleX(1.25) scaleY(1.1)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
.cglow{transform-box:fill-box;transform-origin:50% 50%;animation:glowF 1.4s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.9,1.12) rotate(2deg)}}
@keyframes glowF{from{opacity:.7;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}

/* lanterns */
.lanterns{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lantern{position:absolute;width:var(--w);height:calc(var(--w)*1.25);border-radius:42% 42% 30% 30%/32% 32% 22% 22%;
  background:radial-gradient(circle at 50% 70%,#FFF4C2,#FFD84D 45%,#F2A33B);box-shadow:0 0 22px 6px rgba(255,200,80,.55);
  animation:rise var(--d) linear var(--dl) infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}10%{opacity:.95}85%{opacity:.8}100%{opacity:0;transform:translate3d(var(--sx),calc(var(--up)*-1),0) scale(1)}}
.lanterns.small .lantern{box-shadow:0 0 14px 3px rgba(255,200,80,.5)}

/* floating sunflowers (page 3) */
.fl-sun{position:absolute;z-index:3;width:var(--w,64px);height:var(--w,64px);animation:flSun 5s ease-in-out infinite alternate;pointer-events:none}
.fl-sun.a{left:6%;top:70%;--w:62px}
.fl-sun.b{right:7%;top:78%;--w:76px;animation-delay:-2s}
.fl-sun.c{left:64%;top:63%;--w:48px;animation-delay:-3.5s}
@keyframes flSun{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-12px) rotate(10deg)}}

/* corner sunflowers */
.deco{position:absolute;bottom:-9%;width:min(30vw,150px);z-index:3;pointer-events:none;transform-origin:50% 100%;animation:swayDeco 5s ease-in-out infinite alternate}
.deco-l{left:-3%;--r:-5deg}
.deco-r{right:-3%;--r:5deg;animation-delay:-2s}
.deco .sf{width:100%;height:auto}
@keyframes swayDeco{from{transform:rotate(calc(var(--r) - 2deg))}to{transform:rotate(calc(var(--r) + 2deg))}}

/* page 2 dodge zone */
.dodge-zone{position:relative;height:172px;width:100%;margin-top:18px}
.yes-row{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center}
.dodge-zone .no{position:absolute;left:0;top:0;transition:left .38s cubic-bezier(.34,1.4,.5,1),top .38s cubic-bezier(.34,1.4,.5,1)}

/* page 3 zoom transition */
.scene[data-scene=p3] .bg{transition:transform 2.1s cubic-bezier(.55,.1,.75,.45),filter 2.1s ease}
.scene[data-scene=p3].zooming .bg{transform:scale(2.6);filter:brightness(1.18) saturate(1.1)}
.scene[data-scene=p3] .center-col,.scene[data-scene=p3] .petals,.scene[data-scene=p3] .fl-sun,.scene[data-scene=p3] .sparkles{transition:opacity .6s ease}
.scene[data-scene=p3].zooming .center-col,.scene[data-scene=p3].zooming .petals,.scene[data-scene=p3].zooming .fl-sun,.scene[data-scene=p3].zooming .sparkles{opacity:0}

/* ---------- page 4 : first-person pier ---------- */
.world{inset:-2%;animation:cam 14s ease-in-out infinite alternate}
@keyframes cam{from{transform:translate3d(-.6%,0,0) scale(1)}to{transform:translate3d(.6%,.5%,0) scale(1.015)}}
.frame{position:absolute;top:0;bottom:0;left:50%;height:100%;aspect-ratio:1/2;max-width:100%;transform:translateX(-50%)}
.moon{position:absolute;left:72%;top:13%;width:clamp(44px,13%,64px);aspect-ratio:1;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 38% 36%,#FFFDF0,#FFE9A8 70%,#F7D77A);
  box-shadow:0 0 30px 10px rgba(255,236,170,.45),0 0 90px 30px rgba(255,236,170,.2)}
.moon-refl{position:absolute;left:calc(72% + 3%);top:40.6%;width:12%;height:24%;z-index:1;transform:translateX(-50%);
  background:repeating-linear-gradient(to bottom,rgba(255,236,170,.9) 0 2px,transparent 2px 6px,rgba(255,236,170,.55) 6px 7px,transparent 7px 13px);
  -webkit-mask-image:radial-gradient(ellipse 60% 100% at 50% 0,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 60% 100% at 50% 0,#000 10%,transparent 75%);
  filter:blur(1.4px);animation:moonShim 3s ease-in-out infinite alternate}
@keyframes moonShim{from{transform:translateX(-50%) scaleX(.7)}to{transform:translateX(-50%) scaleX(1.4)}}
.pier{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2}
.kr-ripples{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.ripple{position:absolute;left:0;top:0;border:1.5px solid rgba(255,232,170,.8);border-radius:50%;box-shadow:0 0 8px rgba(255,214,102,.35);opacity:0;
  animation:ripple 2.7s ease-out forwards}
@keyframes ripple{0%{opacity:.9;transform:translate3d(var(--x),var(--y),0) translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate3d(var(--x),var(--y),0) translate(-50%,-50%) scale(1.7)}}

.kr4{position:absolute;left:50%;top:0;z-index:4;transform-origin:50% 100%;will-change:transform}
.kr4 .kr-bob{position:absolute;inset:0;animation:bobY 3.4s ease-in-out infinite}
.kr4 .kr-refl{opacity:0;transition:opacity 1.2s ease}
.kr4.wet .kr-refl{opacity:.85}
.kr-shadow{position:absolute;left:6%;right:6%;bottom:-3%;height:12%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(4px);transition:opacity .6s}
.kr4.wet .kr-shadow{opacity:0}
.kr-wake{position:absolute;left:-8%;right:-8%;bottom:-6%;height:20%;border-radius:50%;border:2px solid rgba(255,235,170,.45);opacity:0;transition:opacity .8s}
.kr4.wet .kr-wake{opacity:1}
.beacon{position:absolute;left:0;top:0;z-index:4;opacity:0;pointer-events:none;will-change:transform}
.beacon .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#FFF3B8;box-shadow:0 0 16px 8px rgba(255,214,102,.9),0 0 34px 14px rgba(255,200,80,.45)}
.beacon .streak{position:absolute;left:-1px;top:6px;width:2px;height:22px;top:6px;background:linear-gradient(to bottom,rgba(255,214,102,.8),rgba(255,214,102,0));filter:blur(1px)}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(5,12,28,.55) 100%)}

.p4-ui{position:absolute;inset:0;z-index:6;pointer-events:none}
.p4-ui button{pointer-events:auto}
.hint-wrap{position:absolute;left:0;right:0;top:max(5dvh,env(safe-area-inset-top));display:flex;justify-content:center;padding:0 16px;transition:opacity .6s,transform .6s}
.hint-wrap.gone{opacity:0;transform:translateY(-10px)}
.hint{width:max-content;max-width:88vw;text-align:center;padding:.7em 1.4em;border-radius:999px;background:rgba(24,43,73,.6);
  color:var(--butter);border:1px solid rgba(255,230,160,.35);font-weight:600;font-size:clamp(1rem,4.2vw,1.2rem);line-height:1.5;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-wrap:balance}
.act-wrap{position:absolute;left:0;right:0;bottom:max(6dvh,env(safe-area-inset-bottom));display:grid;justify-items:center}
.act-wrap>*{grid-area:1/1}
#btnRelease.gone{opacity:0!important;pointer-events:none;animation:none}
.next{opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease,visibility 0s linear .9s,box-shadow .2s}
.next.show{opacity:1;visibility:visible;transform:none;transition:opacity .9s ease,transform .9s ease,visibility 0s}
.msg-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 18px;pointer-events:none}
.msg-card{width:min(90vw,440px);padding:26px 22px;border-radius:26px;text-align:center;color:var(--cream);
  background:rgba(14,26,48,.5);border:1px solid rgba(255,230,160,.28);box-shadow:0 12px 40px rgba(0,0,0,.35);
  font-size:clamp(1.08rem,4.6vw,1.38rem);line-height:1.95;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.7),0 2px 12px rgba(0,0,0,.55);
  opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
.msg-card.on{opacity:1;transform:none}
.msg-card .ln{display:block;margin:10px 0;opacity:0;transform:translateY(10px);text-wrap:balance;overflow-wrap:anywhere;transition:opacity 1.6s ease,transform 1.6s ease}
.msg-card .ln.show{opacity:1;transform:none}

/* ---------- page 5 ---------- */
.glow{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 36%,rgba(255,236,140,.75),rgba(255,236,140,0) 60%)}
.scene:is(.active,.leaving) .glow{animation:fadeIn 1.8s ease both,glowBreath 5s ease-in-out 1.8s infinite alternate}
@keyframes glowBreath{from{opacity:.75}to{opacity:1}}
.center-col.final{gap:clamp(10px,2.4dvh,22px)}
.sf-final{width:min(80vw,46dvh,420px);aspect-ratio:1;animation:sfSway 5s ease-in-out infinite alternate;position:relative;z-index:1}
.scene[data-scene=p5] .sf .pt{animation-duration:.95s;animation-delay:calc(var(--i)*.1s + .9s)}
.scene[data-scene=p5] .sf .ctr{animation-delay:.7s}
.final-msg{font-size:clamp(2.1rem,9.5vw,3.5rem);font-weight:700;color:var(--brown);text-align:center;line-height:1.3;opacity:0;
  text-shadow:0 0 22px rgba(255,255,255,.95),0 3px 0 rgba(242,185,59,.35)}
.scene:is(.active,.leaving) .final-msg{animation:msgIn 1.5s cubic-bezier(.2,.9,.3,1.15) 3.4s both,msgGlow 3.2s ease-in-out 5s infinite alternate}
@keyframes msgIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes msgGlow{from{text-shadow:0 0 18px rgba(255,255,255,.9),0 3px 0 rgba(242,185,59,.35)}to{text-shadow:0 0 34px rgba(255,216,77,1),0 3px 0 rgba(242,185,59,.5)}}
.hearts{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.fh{position:absolute;bottom:22%;width:var(--hs);height:var(--hs);animation:heartUp var(--hd) ease-out forwards}
.fh svg{width:100%;height:100%;display:block}
@keyframes heartUp{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(var(--hr))}15%{opacity:.95}100%{opacity:0;transform:translate(var(--hx),-36dvh) scale(1) rotate(calc(var(--hr)*-1))}}

/* ---------- responsive tweaks ---------- */
@media (min-width:700px){
  .card{padding:30px 28px 28px}
  .deco{width:min(18vw,170px)}
}
@media (max-height:640px){
  .sf-hero{width:min(50vw,28dvh)}
  .dodge-zone{height:160px}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  .petal,.sp,.lantern,.fly,.world,.deco,.fl-sun,.fest-kr,.sf-hero .sf,.sf-final,.btn.bounce,.sf-hero::before,.flt,.rip,.star,.shl,.streak{animation:none!important}
  .scene{transition-duration:.25s!important}
  .scene:is(.active,.leaving) .enter{animation-duration:.01s!important;animation-delay:0s!important}
  .scene.zooming .bg{transition-duration:.4s!important;transform:none!important}
  .scene:is(.active,.leaving) .sf .pt,.scene:is(.active,.leaving) .sf .ctr{animation-duration:.01s!important;animation-delay:0s!important}
  .scene:is(.active,.leaving) .final-msg{animation:msgIn .4s ease .2s both!important}
  .msg-card .ln{transition-duration:.5s}
  .btn.shake{animation:none}
}
</style>
</head>
<body>

<!-- shared gradients for the SVG illustrations -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gPetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#FFD84D"/></linearGradient>
    <radialGradient id="gCenter" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#9a7449"/><stop offset=".6" stop-color="#71533B"/><stop offset="1" stop-color="#4a3321"/></radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#73965B"/><stop offset="1" stop-color="#A9CB80"/></linearGradient>
    <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF8A1F"/><stop offset=".55" stop-color="#FFC94A"/><stop offset="1" stop-color="#FFF7C8"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#FFD66B" stop-opacity=".9"/><stop offset=".5" stop-color="#FFD66B" stop-opacity=".25"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<div id="app">

  <!-- ============ LOADING ============ -->
  <section class="scene s-yellow" data-scene="loading">
    <div class="petals" data-n="10"></div>
    <div class="sparkles" data-n="16"></div>
    <div class="center-col">
      <div class="enter pop" style="--dl:.05s"><div class="sf-hero" data-sf="face"></div></div>
      <p class="load-text enter" style="--dl:.5s" data-t="loadingText"></p>
      <div class="bar enter" style="--dl:.6s"><i></i></div>
    </div>
  </section>

  <!-- ============ PAGE 1 ============ -->
  <section class="scene s-yellow" data-scene="p1">
    <div class="petals" data-n="12"></div>
    <div class="sparkles" data-n="18"></div>
    <div class="center-col">
      <div class="enter pop" style="--dl:.15s"><div class="sf-hero big" data-sf="face"></div></div>
      <div class="card enter" style="--dl:.45s">
        <h1 data-t="p1.title"></h1>
        <div class="btns">
          <button class="btn primary bounce" data-act="p1-yes" data-t="p1.yes"></button>
          <button class="btn secondary" data-act="p1-what" data-t="p1.no"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ PAGE 2 ============ -->
  <section class="scene" data-scene="p2">
    <div class="bg">
      <div class="rv" data-h="56" data-mode="dusk"></div>
      <div class="fest-kr slow"></div>
    </div>
    <div class="petals" data-n="9"></div>
    <div class="sparkles" data-n="14"></div>
    <div class="deco deco-l" data-sf="stem"></div>
    <div class="deco deco-r" data-sf="stem"></div>
    <div class="center-col top">
      <div class="card enter" style="--dl:.25s">
        <h1 data-t="p2.title"></h1>
        <p class="sub" data-t="p2.sub"></p>
        <div class="dodge-zone">
          <div class="yes-row"><button class="btn primary bounce yes" data-act="p2-yes" data-t="p2.yes"></button></div>
          <button class="btn secondary no" data-act="p2-no" data-t="p2.no"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ PAGE 3 ============ -->
  <section class="scene" data-scene="p3">
    <div class="bg">
      <div class="rv" data-h="58" data-mode="night"></div>
      <div class="lanterns" data-n="7"></div>
      <div class="fest-kr"></div>
    </div>
    <div class="petals" data-n="9"></div>
    <div class="sparkles" data-n="16"></div>
    <div class="fl-sun a" data-sf="plain"></div>
    <div class="fl-sun b" data-sf="plain"></div>
    <div class="fl-sun c" data-sf="plain"></div>
    <div class="center-col top">
      <div class="card enter" style="--dl:.25s">
        <h1 data-t="p3.title"></h1>
        <button class="btn primary bounce" data-act="p3-go" data-t="p3.btn"></button>
      </div>
    </div>
  </section>

  <!-- ============ PAGE 4 : first-person pier ============ -->
  <section class="scene" data-scene="p4">
    <div class="world">
      <div class="rv" data-h="40" data-mode="night"></div>
      <div class="lanterns small" data-n="5"></div>
      <div class="frame">
        <div class="moon"></div>
        <div class="moon-refl"></div>
        <svg class="pier" viewBox="0 0 100 200" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="kr-ripples"></div>
        <div class="kr4" aria-hidden="true">
          <div class="kr-refl"></div>
          <div class="kr-shadow"></div>
          <div class="kr-wake"></div>
          <div class="kr-bob" id="kr4svg"></div>
        </div>

    // tiny floating lights on the water
    for (i = 0; i < 9; i++) {
      add('flt', 'left:' + rnd(4, 96).toFixed(1) + '%;top:' + (h + (100 - h) * rnd(.04, .3)).toFixed(1) + '%;--s:' + rnd(2.5, 5).toFixed(1) + 'px;--d:' + rnd(6, 12).toFixed(1) + 's;--dl:-' + rnd(0, 8).toFixed(1) + 's');
    }
    // fireflies
    for (i = 0; i < 10; i++) {
      add('fly', 'left:' + rnd(3, 97).toFixed(1) + '%;top:' + rnd(8, h + 20).toFixed(1) + '%;--fx:' + rnd(-30, 30).toFixed(0) + 'px;--fy:' + rnd(-40, 20).toFixed(0) + 'px;--d:' + rnd(4, 8).toFixed(1) + 's;--dl:-' + rnd(0, 6).toFixed(1) + 's');
    }
  }
  $$('.rv').forEach(buildRiver);

  $$('.lanterns').forEach(function (box) {
    var n = +box.dataset.n || 6, h = +(box.parentNode.querySelector('.rv') || { dataset: { h: 56 } }).dataset.h;
    for (var i = 0; i < n; i++) {
      var d = document.createElement('i');
      d.className = 'lantern';
      d.style.cssText = 'left:' + rnd(4, 94).toFixed(1) + '%;top:' + (h - 2) + '%;--w:' + rnd(16, 32).toFixed(0) + 'px;--d:' + rnd(18, 30).toFixed(1) + 's;--dl:-' + rnd(0, 24).toFixed(1) + 's;--sx:' + rnd(-40, 50).toFixed(0) + 'px;--up:' + (h + 8) + 'dvh';
      box.appendChild(d);
    }
  });

  /* =====================================================
     PARTICLES
     ===================================================== */
  function fillPetals(scene) {
    var box = $('.petals', scene);
    if (!box || reduce) return;
    box.innerHTML = '';
    var n = +box.dataset.n || 10;
    for (var i = 0; i < n; i++) {
      var p = document.createElement('i');
      p.className = 'petal';
      p.style.cssText = 'left:' + rnd(0, 100).toFixed(1) + '%;--s:' + rnd(10, 19).toFixed(0) + 'px;--d:' + rnd(10, 17).toFixed(1) + 's;--delay:-' + rnd(0, 16).toFixed(1) + 's;--sw:' + rnd(24, 70).toFixed(0) + 'px;--rot:' + rnd(200, 560).toFixed(0) + 'deg';
      box.appendChild(p);
    }
  }
  function fillSparkles(scene) {
    var box = $('.sparkles', scene);
    if (!box) return;
    box.innerHTML = '';
    var n = reduce ? Math.min(6, +box.dataset.n || 10) : (+box.dataset.n || 12);
    for (var i = 0; i < n; i++) {
      var s = document.createElement('i');
      s.className = 'sp';
      s.style.cssText = 'left:' + rnd(2, 96).toFixed(1) + '%;top:' + rnd(2, 96).toFixed(1) + '%;--s:' + rnd(9, 20).toFixed(0) + 'px;--d:' + rnd(2.2, 4.6).toFixed(1) + 's;--dl:-' + rnd(0, 4).toFixed(1) + 's';
      if (reduce) s.style.animation = 'none', s.style.opacity = '.7';
      box.appendChild(s);
    }
  }
  function clearParticles(scene) {
    var a = $('.petals', scene), b = $('.sparkles', scene);
    if (a) a.innerHTML = '';
    if (b) b.innerHTML = '';
  }

  function burst(x, y, n) {
    var layer = $('#fx');
    n = reduce ? Math.min(6, n || 18) : (n || 18);
    var kinds = ['petal-fx', 'spark', 'heart-fx', 'spark', 'petal-fx'];
    for (var i = 0; i < n; i++) {
      var el = document.createElement('i');
      var a = rnd(0, Math.PI * 2), d = rnd(60, 175);
      el.className = 'fx ' + kinds[i % kinds.length];
      el.style.cssText = 'left:' + x + 'px;top:' + y + 'px;--dx:' + (Math.cos(a) * d).toFixed(0) + 'px;--dy:' + (Math.sin(a) * d - 50).toFixed(0) + 'px;--r:' + rnd(-240, 240).toFixed(0) + 'deg;--sz:' + rnd(11, 23).toFixed(0) + 'px';
      layer.appendChild(el);
      setTimeout(remover(el), 1400);
    }
  }
  function remover(el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }
  function burstAt(btn, n) {
    var r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, n);
  }
  function petalRain(n) {
    if (reduce) return;
    var layer = $('#fx');
    for (var i = 0; i < n; i++) {
      var el = document.createElement('i');
      el.className = 'fx rain ' + (i % 3 ? 'petal-fx' : 'spark');
      el.style.cssText = 'left:' + rnd(0, 100).toFixed(1) + '%;top:0;--dx:' + rnd(-80, 80).toFixed(0) + 'px;--r:' + rnd(200, 600).toFixed(0) + 'deg;--sz:' + rnd(12, 22).toFixed(0) + 'px;--rd:' + rnd(1.4, 2.4).toFixed(2) + 's;animation-delay:' + rnd(0, .7).toFixed(2) + 's';
      layer.appendChild(el);
      setTimeout(remover(el), 3400);
    }
  }

  /* =====================================================
     SCENE MANAGER
     ===================================================== */
  var scenes = {};
  $$('.scene').forEach(function (s) { scenes[s.dataset.scene] = s; });
  var current = null, busy = false, heartTimer = 0;

  function show(id) {
    var next = scenes[id];
    if (!next || next === current) return;
    var prev = current;
    current = next;
    next.classList.add('active');
    next.classList.remove('leaving');
    fillPetals(next);
    fillSparkles(next);
    if (hooks[id] && hooks[id].enter) hooks[id].enter();
    if (prev) {
      var pid = prev.dataset.scene;
      prev.classList.remove('active');
      prev.classList.add('leaving');
      setTimeout(function () {
        if (current === prev) return;
        prev.classList.remove('leaving');
        clearParticles(prev);
        if (hooks[pid] && hooks[pid].leave) hooks[pid].leave();
      }, FADE + 150);
    }
  }
  function go(id, delay) {
    setTimeout(function () {
      show(id);
      setTimeout(function () { busy = false; }, FADE + 60);
    }, delay || 0);
  }
  // runs a handler only if the scene is showing and no transition is in flight
  function act(scene, fn) {
    if (busy || current !== scene) return false;
    busy = true;
    fn();
    return true;
  }

  var hooks = {
    p2: { enter: function () { requestAnimationFrame(initNo); } },
    p3: { leave: function () { scenes.p3.classList.remove('zooming'); } },
    p4: { enter: function () { p4Reset(); } },
    p5: {
      enter: function () {
        if (reduce) return;
        clearInterval(heartTimer);
        heartTimer = setInterval(spawnHeart, 1300);
      },
      leave: function () { clearInterval(heartTimer); }
    }
  };

  function spawnHeart() {
    if (current !== scenes.p5) return;
    var box = $('.hearts', scenes.p5), d = document.createElement('div');
    d.className = 'fh';
    d.style.cssText = 'left:' + rnd(22, 78).toFixed(0) + '%;--hs:' + rnd(16, 28).toFixed(0) + 'px;--hd:' + rnd(3.6, 5.2).toFixed(1) + 's;--hx:' + rnd(-40, 40).toFixed(0) + 'px;--hr:' + rnd(-18, 18).toFixed(0) + 'deg';
    d.innerHTML = heartSVG(['#FF8FA3', '#FFB3C1', '#FFD84D'][Math.floor(rnd(0, 3))]);
    box.appendChild(d);
    setTimeout(remover(d), 5400);
    if (box.children.length > 10) box.removeChild(box.firstChild);
  }

  /* =====================================================
     PAGE 1
     ===================================================== */
  $('[data-act=p1-yes]').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    act(scenes.p1, function () {
      $('.sf-hero', scenes.p1).classList.add('jump');
      burstAt(btn, 22);
      go('p2', reduce ? 150 : 1000);
    });
  });
  $('[data-act=p1-what]').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    act(scenes.p1, function () {
      $('.sf-hero', scenes.p1).classList.add('spin');
      burstAt(btn, 26);
      petalRain(14);
      go('p2', reduce ? 150 : 1200);
    });
  });

  /* =====================================================
     PAGE 2 — "ไม่ไป" dodges but never navigates
     ===================================================== */
  var zone = $('.dodge-zone'), noBtn = $('.no', zone), yesBtn = $('.yes', zone);
  var noPos = { x: 0, y: 0 }, lastDodge = 0;

  function zoneInfo() {
    var z = zone.getBoundingClientRect(), y = yesBtn.getBoundingClientRect();
    return {
      z: z, zw: z.width, zh: z.height, bw: noBtn.offsetWidth, bh: noBtn.offsetHeight,
      yes: { l: y.left - z.left, t: y.top - z.top, r: y.right - z.left, b: y.bottom - z.top }
    };
  }
  function placeNo(x, y) {
    noPos.x = x; noPos.y = y;
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }
  function initNo() {
    var r = zoneInfo();
    if (!r.zw) return;
    placeNo((r.zw - r.bw) / 2, r.zh - r.bh);
  }
  function dodge(px, py) {
    var now = performance.now();
    if (now - lastDodge < 420) return;
    lastDodge = now;
    var r = zoneInfo();
    if (!r.zw) return;
    var best = null, bestScore = -1, i;
    var pxz = px - r.z.left, pyz = py - r.z.top;
    for (i = 0; i < 30; i++) {
      var x = rnd(0, Math.max(0, r.zw - r.bw)), y = rnd(r.yes.b + 12, Math.max(r.yes.b + 12, r.zh - r.bh));
      // never overlap the "yes" button
      if (x < r.yes.r + 10 && x + r.bw > r.yes.l - 10 && y < r.yes.b + 10 && y + r.bh > r.yes.t - 10) continue;
      var dMove = Math.hypot(x - noPos.x, y - noPos.y);
      if (dMove < 60) continue;
      var dPtr = Math.hypot(x + r.bw / 2 - pxz, y + r.bh / 2 - pyz);
      var score = dPtr + dMove * .3;
      if (score > bestScore) { bestScore = score; best = { x: x, y: y }; }
    }
    if (!best) { // fallback: hop to the opposite side
      var left = noPos.x > (r.zw - r.bw) / 2;
      best = { x: left ? 0 : r.zw - r.bw, y: r.zh - r.bh };
    }
    placeNo(clamp(best.x, 0, r.zw - r.bw), clamp(best.y, 0, r.zh - r.bh));
  }
  // desktop: dodge when the cursor gets close
  document.addEventListener('pointermove', function (e) {
    if (current !== scenes.p2 || e.pointerType !== 'mouse') return;
    var b = noBtn.getBoundingClientRect(), m = 78;
    if (e.clientX > b.left - m && e.clientX < b.right + m && e.clientY > b.top - m && e.clientY < b.bottom + m) dodge(e.clientX, e.clientY);
  });
  // touch: shift as soon as a finger lands on it (also stops the click)
  noBtn.addEventListener('touchstart', function (e) {
    if (e.cancelable) e.preventDefault();
    var t = e.touches[0];
    dodge(t.clientX, t.clientY);
  }, { passive: false });
  noBtn.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse') dodge(e.clientX, e.clientY);
  });
  // a click that still gets through (keyboard, assistive tech…) → cute reaction, stay on page 2
  noBtn.addEventListener('click', function (e) {
    e.preventDefault();
    noBtn.classList.remove('shake');
    void noBtn.offsetWidth;
    noBtn.classList.add('shake');
    var r = noBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, 6);
    setTimeout(function () { noBtn.classList.remove('shake'); }, 600);
    lastDodge = 0;
    dodge(r.left + r.width / 2, r.top + r.height / 2);
  });
  window.addEventListener('resize', function () { if (current === scenes.p2) initNo(); });

  yesBtn.addEventListener('click', function (e) {
    var btn = e.currentTarget;
    act(scenes.p2, function () {
      burstAt(btn, 34);
      petalRain(26);
      go('p3', reduce ? 150 : 1100);
    });
  });

  /* =====================================================
     PAGE 3 — zoom toward the riverside
     ===================================================== */
  $('[data-act=p3-go]').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    act(scenes.p3, function () {
      burstAt(btn, 14);
      scenes.p3.classList.add('zooming');
      go('p4', reduce ? 450 : 1500);
    });
  });

  /* =====================================================
     PAGE 4 — first-person krathong release
     ===================================================== */
  var kr = $('.kr4'), beacon = $('.beacon'), ripples = $('.kr-ripples');
  var btnRelease = $('#btnRelease'), btnNext = $('#btnNext'), msg = $('#msg');
  var K = { released: false, raf: 0, z0: 1.36, zA: 3, zEnd: 16, W: 0, H: 0, kw: 0, kh: 0, t0: 0, tA: 0, tB: 0, dropped: false, lastRip: 0, timers: [] };

  // build the blessing as separate lines (split on the spaces in config) — text is untouched
  (function buildMessage() {
    var text = (C.p4 && C.p4.message) || '';
    msg.setAttribute('aria-label', text);
    text.trim().split(/\s+/).forEach(function (line) {
      var s = document.createElement('span');
      s.className = 'ln';
      s.textContent = line;
      msg.appendChild(s);
    });
  })();

  function kDims() {
    var fr = $('.frame', scenes.p4);
    K.W = fr.offsetWidth || window.innerWidth;
    K.H = fr.offsetHeight || window.innerHeight;
    K.kw = Math.min(K.W * 0.54, 300);
    K.kh = K.kw * 0.75;
    kr.style.width = K.kw + 'px';
    kr.style.height = K.kh + 'px';
    kr.style.marginLeft = (-K.kw / 2) + 'px';
  }
  function Yz(z) { return (80 + 120 / z) / 200 * K.H; }
  function kPlace(z, x, bob) {
    var s = K.z0 / z, yb = Yz(z) - bob * s;
    kr.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + (yb - K.kh).toFixed(1) + 'px,0) scale(' + s.toFixed(4) + ')';
    return { s: s, yb: yb };
  }
  function p4Reset() {
    K.timers.forEach(clearTimeout); K.timers = [];
    cancelAnimationFrame(K.raf);
    K.released = false; K.dropped = false;
    kr.classList.remove('wet');
    beacon.style.opacity = 0;
    ripples.innerHTML = '';
    btnRelease.disabled = false;
    btnRelease.classList.remove('gone');
    btnNext.classList.remove('show');
    btnNext.disabled = true;
    msg.classList.remove('on');
    $$('.ln', msg).forEach(function (l) { l.classList.remove('show'); });
    $('.hint-wrap', scenes.p4).classList.remove('gone');
    kDims();
    kPlace(K.z0, 0, 0);
  }
  window.addEventListener('resize', function () { if (current === scenes.p4 && !K.released) { kDims(); kPlace(K.z0, 0, 0); } });

  function ripple(x, y, s, strong) {
    var d = document.createElement('i');
    var w = Math.max(20, K.kw * s * (strong ? 1.35 : 1.05));
    d.className = 'ripple';
    d.style.cssText = 'width:' + w.toFixed(0) + 'px;height:' + (w * .26).toFixed(0) + 'px;--x:' + x.toFixed(0) + 'px;--y:' + y.toFixed(0) + 'px';
    ripples.appendChild(d);
    setTimeout(remover(d), 2900);
  }
  function onDrop(x, yb, s) {
    kr.classList.add('wet');
    ripple(K.W / 2 + x, yb, s, true);
    K.timers.push(setTimeout(function () { ripple(K.W / 2 + x, yb, s * .9, true); }, 260));
    K.timers.push(setTimeout(function () { ripple(K.W / 2 + x, yb, s * .8, false); }, 540));
  }

  function loop(now) {
    var t = now - K.t0, z, x = 0, bob = 0, u;
    if (t < K.tA) {
      u = t / K.tA;
      z = K.z0 + (K.zA - K.z0) * u * u;              // pushed off, slides along the pier
    } else {
      u = Math.min(1, (t - K.tA) / K.tB);
      z = K.zA + (K.zEnd - K.zA) * (1 - (1 - u) * (1 - u)); // glides away, slowing down
      var k = (t - K.tA) / 1000;
      bob = reduce ? 0 : Math.exp(-k * 1.5) * Math.sin(k * 8) * 7;
      x = K.W * 0.1 * Math.pow(u, 0.7) + Math.sin(u * 6.5) * K.W * 0.012 * (1 - u * 0.6);
    }
    var p = kPlace(z, x, bob);
    if (t >= K.tA && !K.dropped) { K.dropped = true; onDrop(x, p.yb, p.s); }
    if (t >= K.tA && now - K.lastRip > 650 + (z - 3) * 38 && u < 0.97) {
      K.lastRip = now;
      ripple(K.W / 2 + x, p.yb + 1, p.s, false);
    }
    // a small steady glow keeps the candle visible once the krathong is tiny
    beacon.style.transform = 'translate3d(' + (K.W / 2 + x).toFixed(1) + 'px,' + (p.yb - K.kh * p.s * .86).toFixed(1) + 'px,0)';
    beacon.style.opacity = clamp((z - 4.5) / 7, 0, 0.95).toFixed(2);
    if (t < K.tA + K.tB) K.raf = requestAnimationFrame(loop);
  }

  function release() {
    if (K.released || current !== scenes.p4) return;     // exactly one krathong per visit
    K.released = true;
    btnRelease.disabled = true;
    btnRelease.classList.add('gone');
    $('.hint-wrap', scenes.p4).classList.add('gone');
    kDims();
    K.tA = reduce ? 1300 : 2600;
    K.tB = reduce ? 4500 : 11500;
    K.t0 = performance.now();
    K.lastRip = K.t0;
    K.raf = requestAnimationFrame(loop);
    // the blessing starts only after the krathong has dropped in and begun to drift away
    K.timers.push(setTimeout(revealMessage, reduce ? 1800 : 3700));
  }
  function revealMessage() {
    var lines = $$('.ln', msg), gap = reduce ? 900 : 2600, i;
    msg.classList.add('on');
    lines.forEach(function (ln, idx) {
      K.timers.push(setTimeout(function () { ln.classList.add('show'); }, 500 + idx * gap));
    });
    var last = 500 + (lines.length - 1) * gap + (reduce ? 600 : 1800) + 700; // wait for the final line to finish fading in
    K.timers.push(setTimeout(function () {
      btnNext.disabled = false;
      btnNext.classList.add('show');
    }, last));
  }
  btnRelease.addEventListener('click', release);
  btnNext.addEventListener('click', function (e) {
    var b = e.currentTarget;
    if (b.disabled || !b.classList.contains('show')) return;
    act(scenes.p4, function () {
      b.disabled = true;
      burstAt(b, 14);
      petalRain(10);
      go('p5', reduce ? 150 : 900);
    });
  });

  /* =====================================================
     OPTIONAL AUDIO (fails silently if missing)
     ===================================================== */
  (function audio() {
    var a = C.audio;
    if (!a || !a.src) return;
    try {
      var el = new Audio(a.src);
      el.loop = true; el.volume = a.volume == null ? .5 : a.volume;
      el.addEventListener('error', function () { el = null; });
      var start = function () {
        document.removeEventListener('pointerdown', start);
        if (el) { var p = el.play(); if (p && p.catch) p.catch(function () {}); }
      };
      document.addEventListener('pointerdown', start);
    } catch (err) { /* ignore */ }
  })();

  /* =====================================================
     BOOT — loading screen, then page 1
     ===================================================== */
  function boot() {
    var q = /[?&]start=(p[1-5])\b/.exec(window.location.search);
    if (q && scenes[q[1]]) {
      busy = false;
      show('loading');
      setTimeout(function () { show(q[1]); }, 30);
      return;
    }
    show('loading');
    var bar = $('.bar i'), t0 = performance.now(), minMs = reduce ? 800 : 2600, ready = false, left = false;
    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.race([fontsReady, sleep(2200)]).then(function () { ready = true; });
    var iv = setInterval(function () {
      var p = clamp((performance.now() - t0) / minMs, 0, 1), eased = 1 - Math.pow(1 - p, 2);
      bar.style.width = ((ready ? eased : Math.min(eased, 0.88)) * 100).toFixed(1) + '%';
      if (p >= 1 && ready && !left) {
        left = true;
        clearInterval(iv);
        bar.style.width = '100%';
        busy = true;
        setTimeout(function () { go('p1', 0); }, reduce ? 100 : 450);
      }
    }, 50);
    // safety net: never get stuck on the loading screen
    setTimeout(function () { if (!left) { left = true; clearInterval(iv); busy = true; go('p1', 0); } }, 5200);
  }
  boot();

  // tiny hook for automated checks
  window.__app = { show: show, get current() { return current && current.dataset.scene; } };
})();
</script>
</body>
</html>
